<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SIGE | Software y aplicaciones</title>
	<link rel="stylesheet" href="styles.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="container">
		<header>
			<a href="areapersonal.html" class="brand"><h1>SIGE</h1></a>
			<nav><ul><li><button class="btn" type="button" onclick="window.location.href='login.html'">CERRAR SESIÓN</button></li></ul></nav>
		</header>
		<main class="main-content personal-layout">
			<aside class="quick-links-panel">
				<h2 class="quick-links-title">Opciones de TIC</h2>
				<nav class="quick-links" aria-label="Opciones de TIC">
					<a href="areapersonal.html" class="quick-link">ÁREA PERSONAL</a>
					<a href="tic.html" class="quick-link">VOLVER A TIC</a>
					<a href="creacion_usuarios.html" class="quick-link">CREACIÓN DE USUARIOS</a>
					<a href="Soportetecnico.html" class="quick-link">SOPORTE TÉCNICO</a>
					<a href="equiposeinventario.html" class="quick-link">EQUIPOS E INVENTARIO</a>
					<a href="redeseinfraestructura.html" class="quick-link">REDES E INFRAESTRUCTURA</a>
					<a href="softwareeaplicaciones.html" class="quick-link" aria-current="page">SOFTWARE Y APLICACIONES</a>
					<a href="seguridadinformatica.html" class="quick-link">SEGURIDAD INFORMÁTICA</a>
				</nav>
			</aside>
			<div class="personal-main">
				<section class="intro-section tic-detail-intro">
					<h1>Software y aplicaciones</h1>
				</section>

				<section class="tic-management-section" aria-labelledby="software-management-title">
					<div class="tic-management-heading">
						<div><h2 id="software-management-title">Software y aplicaciones</h2></div>
					</div>
					<form class="tic-manage-form" data-tic-record-form data-tic-module="software" data-tic-title-field="nombre">
						<div class="tic-manage-grid">
							<div class="tic-manage-field"><label for="software-name">Aplicación</label><input id="software-name" name="nombre" data-record-field data-record-label="Aplicación" required></div>
							<div class="tic-manage-field"><label for="software-vendor">Proveedor</label><input id="software-vendor" name="proveedor" data-record-field data-record-label="Proveedor"></div>
							<div class="tic-manage-field"><label for="software-version">Versión</label><input id="software-version" name="version" data-record-field data-record-label="Versión"></div>
							<div class="tic-manage-field"><label for="software-license">Tipo de licencia</label><select id="software-license" name="licencia" data-record-field data-record-label="Licencia" required><option value="">Selecciona</option><option>Suscripción</option><option>Perpetua</option><option>Gratuita</option><option>Código abierto</option><option>Otra</option></select></div>
							<div class="tic-manage-field"><label for="software-expiry">Vencimiento o renovación</label><input id="software-expiry" name="vigencia" data-record-field data-record-label="Vencimiento" type="date"></div>
							<div class="tic-manage-field"><label for="software-total">Licencias totales</label><input id="software-total" name="licenciasTotales" data-record-field data-record-label="Licencias totales" type="number" min="0" step="1" required></div>
							<div class="tic-manage-field"><label for="software-quantity">Licencias asignadas</label><input id="software-quantity" name="cantidad" data-record-field data-record-label="Licencias asignadas" type="number" min="0" step="1" required></div>
							<div class="tic-manage-field"><label for="software-installed">Estado de instalación</label><select id="software-installed" name="instalacion" data-record-field data-record-label="Instalación"><option>Instalado</option><option>Pendiente</option><option>En actualización</option><option>No instalado</option></select></div>
							<div class="tic-manage-field"><label for="software-update">Última actualización</label><input id="software-update" name="ultimaActualizacion" data-record-field data-record-label="Última actualización" type="date"></div>
							<div class="tic-manage-field"><label for="software-area">Área responsable</label><input id="software-area" name="area" data-record-field data-record-label="Área responsable"></div>
							<div class="tic-manage-field tic-manage-field-full"><label for="software-users">Usuarios o áreas con acceso</label><textarea id="software-users" name="accesos" data-record-field data-record-label="Usuarios o áreas con acceso" rows="2"></textarea></div>
							<div class="tic-manage-field"><label for="software-status">Estado</label><select id="software-status" name="estado" data-record-field data-record-label="Estado" required><option>Activo</option><option>Por renovar</option><option>En evaluación</option><option>Retirado</option></select></div>
							<div class="tic-manage-field tic-manage-field-full"><label for="software-notes">Notas y condiciones de uso</label><textarea id="software-notes" name="notas" data-record-field data-record-label="Notas" rows="3"></textarea></div>
						</div>
						<div class="tic-manage-actions"><button class="btn" type="submit" data-tic-save>Guardar aplicación</button><button class="tic-secondary-button" type="button" data-tic-cancel hidden>Cancelar edición</button></div>
					</form>
					<div class="tic-records-heading">
						<h3>Aplicaciones registradas</h3>
						<div class="tic-record-filters"><input type="search" data-tic-search placeholder="Buscar aplicación" aria-label="Buscar aplicación"><select data-tic-filter aria-label="Filtrar aplicaciones por estado"><option value="">Todos los estados</option><option>Activo</option><option>Por renovar</option><option>En evaluación</option><option>Retirado</option></select></div>
					</div>
					<div class="tic-record-list" data-tic-record-list aria-live="polite"></div>
				</section>
			</div>
		</main>
		<footer><p>&copy; 2026 SIGE. Todos los derechos reservados.</p></footer>
	</div>
</body>
</html>
