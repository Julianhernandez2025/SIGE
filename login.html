<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>SIGE | Iniciar sesión</title>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="brand"><h1>SIGE</h1></a>
            <nav>
                <ul>
                    <li><a href="index.html">INICIO</a></li>
                    <li><a href="servicios.html">NUESTROS SERVICIOS</a></li>
                    <li><a href="contacto.html">CONTACTANOS</a></li>
                    <li><button class="btn" onclick="window.location.href='areapersonal.html'">Iniciar sesión</button></li>
                </ul>
            </nav>
        </header>

        <div class="login-wrap">
            <form class="login-form" onsubmit="window.location.href='areapersonal.html'; return false;">
                <h2>Iniciar sesión</h2>

                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Iniciar sesión</button>

                <p class="register-text">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </p>
            </form>
        </div>

        <footer>
            <p>&copy; 2026 SIGE. Todos los derechos reservados.</p>
        </footer>
    </div>
</body>
</html>
