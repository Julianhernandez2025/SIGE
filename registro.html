<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>SIGE | Iniciar sesión</title>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="brand"><h1>SIGE</h1></a>
            <nav>
                <ul>
                    <li><a href="index.html">INICIO</a></li>
                    <li><a href="servicios.html">NUESTROS SERVICIOS</a></li>
                    <li><a href="contacto.html">CONTACTANOS</a></li>
                    <li><button class="btn" onclick="window.location.href='areapersonal.html'">Iniciar sesión</button></li>
                </ul>
            </nav>
        </header>
    <form class="registro-form" action="registro.html" method="post">
        <div class="registro-grid">
            <div class="full">
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div>
                <label for="empresa">Seleccione:</label>
                <select id="empresa" name="empresa" required>
                    <option value="EMPRESA">EMPRESA</option>
                    <option value="PERSONA NATURAL">PERSONA NATURAL</option>
                </select>
            </div>

            <div>
                <label for="tipo_documento">Tipo de documento:</label>
                <select id="tipo_documento" name="tipo_documento" required>
                    <option value="CC">Cédula de ciudadanía</option>
                    <option value="CE">Cédula de extranjería</option>
                    <option value="NIT">Número de identificación tributaria</option>
                    <option value="PASAPORTE">Pasaporte</option>
                </select>
            </div>

            <div class="full">
                <label for="documento">Número de documento:</label>
                <input type="text" id="documento" name="documento" required>
            </div>

            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="full">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="full">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
        </div>

        <button type="submit">Registrarse</button>
         <p class="register-text">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
                </p>
    </form>
</body>
</html>
