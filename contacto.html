<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGE</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html"><h1>SIGE</h1></a>
            <nav>
                <ul>
                    <li><a href="index.html">INICIO</a></li>
                    <li><a href="servicios.html">NUESTROS SERVICIOS</a></li>
                    <li><a href="contacto.html">CONTACTANOS</a></li>
                    <li><button class="btn" onclick="window.location.href='login.html'">Iniciar sesión</button></li>
                </ul>
            </nav>
        </header>
        <main class="contact-main">
            <section class="contact-heading">
               <h2>Cuéntanos cómo podemos ayudarte</h2>
                <p>Completa el formulario y cuéntanos qué necesitas. Así podremos orientarte mejor.</p>
            </section>

            <form class="contact-form" action="enviar_contacto.php" method="post">
                <div class="contact-fields">
                    <div class="contact-field">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                    </div>
                    <div class="contact-field">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="contact-field">
                        <label for="empresa">Tipo de contacto</label>
                        <select id="empresa" name="empresa" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="empresa1">Empresa</option>
                            <option value="empresa2">Persona natural</option>
                            <option value="empresa3">Otra</option>
                        </select>
                    </div>
                    <div class="contact-field">
                        <label for="nombre_empresa">Nombre de la empresa o persona</label>
                        <input type="text" id="nombre_empresa" name="nombre_empresa" required>
                    </div>
                    <div class="contact-field">
                        <label for="ruc">Número de documento</label>
                        <input type="text" id="ruc" name="ruc" required>
                    </div>
                    <div class="contact-field">
                        <label for="cargo">Cargo</label>
                        <input type="text" id="cargo" name="cargo" autocomplete="organization-title" required>
                    </div>
                    <div class="contact-field">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" autocomplete="tel" required>
                    </div>
                    <div class="contact-field">
                        <label for="asunto">Asunto</label>
                        <select id="asunto" name="asunto" required>
                            <option value="" disabled selected>Selecciona el motivo</option>
                            <option value="informacion">Información</option>
                            <option value="comentario">Comentario</option>
                            <option value="queja">Queja</option>
                        </select>
                    </div>
                    <div class="contact-field contact-field-full">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" placeholder="Escribe aquí los detalles de tu consulta..." required></textarea>
                    </div>
                    <button class="btn contact-submit" type="submit">Enviar consulta</button>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 SIGE. Todos los derechos reservados.</p>
        </footer>
    </div>
</body>
</html>
